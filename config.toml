# ruminator configuration and notes. Credentials belong in .env, never here.
# Use --config path/to/config.toml to select another file.

[llm]
# Changing the provider away from cloudflare is not yet supported.
# Only the explicit `npm run summarize` command makes paid requests.
provider = "cloudflare"
model = "openai/gpt-6-luna"
# Account ID, gateway ID, and API token come from CLOUDFLARE_* environment variables.

[embedding]
# Changing embedding configuration is not yet supported: preprocessing, pooling,
# vector dimensions, and cache identity are tied to this pinned BGE backend.
model = "Xenova/bge-small-en-v1.5"
revision = "ea104dacec62c0de699686887e3f920caeb4f3e3"
dtype = "q8"
pooling = "cls"

[scoring.weights]
# Nonnegative weights must sum to 1. Changes affect new rankings only.
# Feedback remains neutral (0.5) until voting is implemented.
semantic = 0.60
keywords = 0.25
feedback = 0.15

[tokenizer]
# Local counting only: no embedding model or API call is needed.
# Other tokenizer implementations/encodings are not yet supported.
implementation = "gpt-tokenizer"
encoding = "o200k_base"
# An estimate, NOT a verified tokenizer match or upper bound for gpt-6-luna.
# Apply headroom to all message text, plus explicit framing allowances.
safety_multiplier = 1.20
message_overhead = 32
request_overhead = 64

[summaries]
# Estimated INPUT tokens; cached summaries consume no request budget.
run_input_tokens = 250000
paper_input_tokens = 100000
# Includes visible output and reasoning tokens for the initial OpenAI model.
max_completion_tokens = 2048
# Explicit context allowance, including reserved completion tokens.
# This is our application limit, not a claim about every model's context window.
context_tokens = 102048
# No retries: failures and budget skips stay fixed for this digest.
