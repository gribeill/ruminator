title = "ruminator secret scanning"

[extend]
useDefault = true

# Keep the default detector; exempt only reviewed public values in their own files.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public pinned BGE tokenizer revision and SHA-256 checksums"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)src/hosted/bge\.ts$''']
regexes = [
  '''^5c38ec7c405ec4b44b94cc5a9bb96e735b38267a$''',
  '''^d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66$''',
  '''^9261e7d79b44c8195c1cada2b453e55b00aeb81e907a6664974b4d7776172ab3$''',
]

[[rules.allowlists]]
description = "Public Access application audience identifier, not an assertion or credential"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)wrangler\.production\.jsonc$''']
regexes = ['''^c280d8a4336c21c167a4c8b0f92ff6ff48dcd7d0184f76bff75b05a12391c6ef$''']
