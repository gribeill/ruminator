# Browser-visible copy for the local and hosted readers. Edit here, restart local
# processes, and rebuild/redeploy the Worker to apply changes. No online editor.
# Values are plain text, NOT HTML or Markdown; markup is escaped, not executed.
# Keep section/key names. CLI output, logs, paper content, saved documents and
# third-party parser details are data, not page copy. Validation guidance below
# is browser-only; editing it does not change CLI diagnostics.
#
# Dynamic values use {name}. Only the following entries accept placeholders:
# shared.page_title: title (page name), app_name (shared.name)
# footer.copyright: year (current year)
# reading.title: app_name, date (actual announcement date)
# reading.paper_count, reading.other_postings: count (number of papers)
# reading.arxiv: id (base arXiv ID)
# summary.unavailable: reason (one of the summary labels below)
# editor.saved_revision, editor.base_revision, editor.published,
# editor.working, editor.working_summary: revision (saved/applied/frozen revision)
# editor.published_config: revision (ranking), summary_revision (summary settings)
# controls.summary_description: input_limit (per-user estimated input allowance)
# controls.limits: model (saved summary model), input_limit, completion_limit
# populate.description: categories (configured category names)
# populate.limits: model, input_limit (independently enforced for each user)
# status.utc_time: time (ISO UTC timestamp)
# status.failure: date (intended run date), reason (failure label below)
# status.pending, status.unchanged, status.completed: date (intended run date)
# status.shared: date, message (shared-pass status label below)
# validation.profile_heading: heading (submitted heading)
# validation.duplicate_profile, validation.profile_subjects: id (profile ID)
# validation.missing_table, validation.unknown_key, validation.missing_key:
#   path (configuration table/key)
# validation.embedding: key (embedding setting)
# validation.syntax: detail (third-party TOML parser's generated diagnostic)
# Literal {#stable-id} is Markdown syntax, not a substitution slot.
#
# Placeholders are substituted once: braces in dynamic data remain literal.
# Values cannot insert markup. HTML structure, links, controls, CSRF tokens and
# scientific rendering stay in code. Removing a placeholder is allowed; adding
# an unsupported one fails validation rather than silently displaying bad copy.

